allowBuilds:
  esbuild: true

# 0 disables the minimum release age: a version is installable the moment it is
# published. Declared explicitly rather than omitted, so the value stays a decision that
# node-policy.sh in the workspace repository can report on. Note that this is the one
# control that stops automation pulling a freshly compromised version of a real package
# into a build within minutes of it being published, and that 1440 (pnpm's default) is
# what the rest of the rtldev-middleware repositories carry. (RSRMID-3018)
minimumReleaseAge: 0

onlyBuiltDependencies:
  - esbuild

overrides:
  diff: "8.0.3"
  # CVE-2026-34043 (GHSA-qj8w-gfj5-8c6v): CPU-exhaustion DoS via a crafted
  # array-like object, fixed in 7.0.5. Force anything resolving below that
  # up to a patched version — do not add a flat "serialize-javascript"
  # pin below 7.0.5 alongside this; a previous "7.0.3" pin did exactly
  # that, silently reintroducing the vulnerable version underneath this
  # override's own constraint.
  serialize-javascript@<7.0.5: '>=7.0.5'
